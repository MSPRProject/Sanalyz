services:
  db:
    image: postgres:latest
    container_name: sanalyz-db
    environment:
      - POSTGRES_USER=sanalyz
      - POSTGRES_PASSWORD=sanalyz
      - POSTGRES_DB=sanalyz
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    networks:
      - sanalyz-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: sanalyz-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: always
    networks:
      - sanalyz-net

  api:
    build: ./API
    container_name: api-spring
    ports: 
      - "8080:8080"
    volumes:
      - ./API:/app
    depends_on:
      - db
    restart: always
    networks:
      - sanalyz-net

  front: 
    build: ./Front
    container_name: sanalyz-front
    ports: 
      - "4200:4200"
    restart: always
    networks:
      - sanalyz-net
  
  ia: 
    build: ./IA
    container_name: ia
    restart: always
    networks:
      - sanalyz-net
  
  ia-train:
    build: ./IA
    container_name: ia-train
    volumes:
      - ./IA:/app
      - ./IA/models:/app/models
      - ./IA/.env:/app/.env
    command: ["python", ".", "train"]
    restart: "no"
    networks:
      - sanalyz-net

volumes:
  pgdata:
  pgadmin_data:

networks:
  sanalyz-net:
    driver: bridge
